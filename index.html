<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mis pendientes</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Mis estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container my-5">
        <div class="agenda">

            <!-- Encabezado de mi aplicación -->
            <header class="encabezado">
                <div>
                    <h1>Mis pendientes</h1>

                    <p>
                        Aquí organizo las tareas que debo realizar
                        durante la semana.
                    </p>
                </div>

                <span class="semana">
                    Mi semana
                </span>
            </header>

            <div class="row g-4 contenido">

                <!-- Formulario para registrar tareas -->
                <section class="col-lg-5">
                    <div class="nota">
                        <div class="cinta"></div>

                        <h2>Agregar una tarea</h2>

                        <!-- Mensajes de validación -->
                        <div
                            id="errorAlert"
                            class="alert alert-danger d-none"
                            role="alert"
                        ></div>

                        <!-- Mensaje de registro exitoso -->
                        <div
                            id="successAlert"
                            class="alert alert-success d-none"
                            role="alert"
                        ></div>

                        <form id="newTaskForm" novalidate>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label
                                    for="taskName"
                                    class="form-label"
                                >
                                    Nombre de la tarea
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="taskName"
                                    placeholder="Ej. Terminar el taller"
                                >
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label
                                    for="taskDescription"
                                    class="form-label"
                                >
                                    Descripción
                                </label>

                                <textarea
                                    class="form-control"
                                    id="taskDescription"
                                    rows="3"
                                    placeholder="Escribe lo que debes hacer"
                                ></textarea>
                            </div>

                            <!-- Fecha de entrega -->
                            <div class="mb-3">
                                <label
                                    for="taskDate"
                                    class="form-label"
                                >
                                    Fecha de entrega
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="taskDate"
                                >
                            </div>

                            <!-- Estado inicial -->
                            <div class="mb-3">
                                <label
                                    for="taskStatus"
                                    class="form-label"
                                >
                                    Estado
                                </label>

                                <select
                                    class="form-select"
                                    id="taskStatus"
                                >
                                    <option value="">
                                        Selecciona el estado
                                    </option>

                                    <option value="PORHACER">
                                        Por hacer
                                    </option>
                                </select>
                            </div>

                            <!-- Botón principal -->
                            <button
                                type="submit"
                                class="btn boton-tierra"
                            >
                                Guardar tarea
                            </button>
                        </form>

                        <p class="frase">
                            Organizarme me ayuda a cumplir mis metas.
                        </p>
                    </div>
                </section>

                <!-- Lista de tareas -->
                <section class="col-lg-7">
                    <div class="titulo-lista">
                        <div>
                            <h2>Lista de tareas</h2>

                            <p>
                                Estas son las tareas que tengo registradas.
                            </p>
                        </div>

                        <!-- JavaScript actualiza este número -->
                        <span
                            id="taskCounter"
                            class="contador-tareas"
                        >
                            0 tareas
                        </span>
                    </div>

                    <!--
                        TaskManager colocará aquí las tarjetas.
                        Esta lista tendrá un solo EventListener.
                    -->
                    <div
                        id="tasksList"
                        class="row g-3"
                    ></div>
                </section>

            </div>
        </div>
    </main>

    <!--
        Primero cargo la clase y después
        el archivo que controla la aplicación.
    -->
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
